name: Delivery and retention regression tests
on:
  pull_request:
  push:
    branches: [main, feat/architecture-hardening]
permissions:
  contents: read
jobs:
  delivery:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: ['mysql:8.0', 'mariadb:10.11']
        php: ['8.2', '8.5']
    services:
      database:
        image: ${{ matrix.database }}
        env:
          MYSQL_ROOT_PASSWORD: synthetic-test-password
          MYSQL_DATABASE: latra_test_delivery
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -psynthetic-test-password || mysqladmin ping -h 127.0.0.1 -psynthetic-test-password"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      # PHP has no package dependencies; only database/CSV extensions are required.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, pdo_sqlite, curl, mbstring
          coverage: none
      - name: Parse PHP sources
        run: find . -name '*.php' -not -path './.git/*' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Verify SQL and delivery state against disposable database
        env:
          LATRA_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=latra_test_delivery;charset=utf8mb4
          LATRA_TEST_USER: root
          LATRA_TEST_PASSWORD: synthetic-test-password
          LATRA_TEST_ALLOW_RESET: '1'
        run: php tests/delivery-retention.php
      # Explicit DDL is checked twice so an interrupted/repeated upgrade can resume.
      - name: Verify index migration is repeatable
        env:
          DB_HOST: 127.0.0.1
          DB_NAME: latra_test_delivery
          DB_USER: root
          DB_PASS: synthetic-test-password
        run: |
          php scripts/migrate-delivery.php
          php scripts/migrate-delivery.php
      - name: Verify security persistence on disposable fixtures
        env:
          LATRA_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=latra_test_delivery;charset=utf8mb4
          LATRA_TEST_USER: root
          LATRA_TEST_PASSWORD: synthetic-test-password
          LATRA_TEST_ALLOW_RESET: '1'
        run: |
          php tests/security-persistence.php
  ingestion:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        database: ['mysql:8.0', 'mariadb:10.11']
        php: ['8.2', '8.5']
    services:
      database:
        image: ${{ matrix.database }}
        env:
          MYSQL_ROOT_PASSWORD: synthetic-test-password
          MYSQL_DATABASE: latra_test_ingestion
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -psynthetic-test-password || mysqladmin ping -h 127.0.0.1 -psynthetic-test-password"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, pdo_sqlite, curl, mbstring
          coverage: none
      - name: Verify isolated ingestion application orchestration
        run: |
          php tests/ingestion-validation-evidence.php
          php tests/ingestion-trip-stats.php
          php tests/ingestion-device-status.php
          php tests/emergency-events.php
          php tests/ingestion-domain-policies.php
          php tests/scheduled-poll.php
          php tests/wialon-window.php
          php tests/fleet-sync.php
          php tests/relay-runtime-policy.php
          php tests/scheduling.php
          php tests/scheduled-job-dispatch.php
          php tests/scheduling-repository.php
          php tests/retention-usecase.php
          php tests/database-boundary.php
          php tests/entrypoint-audit.php
          php tests/retired-paths.php
          php tests/scheduler-lock.php
          php tests/scheduler-recovery.php
          php tests/worker-cadence.php
          php tests/worker-outage.php
          php tests/relay-latra-transport.php
          php tests/maintenance-jobs.php
          php tests/data-cleanup.php
          php tests/operator-evidence.php
          php tests/operator-actions.php
          php tests/relay-health.php
          php tests/operator-provisioning.php
          php tests/runtime-adapters.php
          php tests/activity-addon.php
          php tests/operator-fetch.php
          php tests/operator-payload.php
          php tests/monitoring-usecases.php
          php tests/webhook-usecase.php
          php tests/vault-usecase.php
          php tests/auth-usecases.php
          php tests/auth-native-session.php
          php tests/security-persistence.php
          php tests/fuel-report-policy.php
